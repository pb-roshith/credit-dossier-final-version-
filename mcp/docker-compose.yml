services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: credit_dossier_mcp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_credit_dossier
    ports:
      - "5432:5432"
    volumes:
      - credit_dossier_mcp_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d credit_dossier_mcp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  credit_dossier_mcp_postgres:
